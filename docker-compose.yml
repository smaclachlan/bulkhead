# Phase 1 topology - see docs/adr/0001-phase-1-four-container-architecture.md
# and docs/plans/phase-1-implementation-plan.md (Milestone 5).
#
# Images are pre-built (not built by Compose itself): `workspace` via
# `nix build .#workspace-image` + `docker load`, the other three via
# `nix run .#build-<name>-image` (plain `docker build`). `nix run .#up`
# does both steps before invoking this file - see flake.nix.
#
# Network segmentation:
#   - workspace: no network at all (README point 4).
#   - internal-workspace: an `internal: true` network joined only by
#     workspace-mcp and orchestrator. ADR-0001 §1 says workspace-mcp should
#     be reachable from the Orchestrator only - phase 1's validation harness
#     (validation-results/phase-1/) found that a single shared `internal`
#     network doesn't actually enforce that (Compose's `internal: true`
#     blocks egress to the outside world, but does NOT isolate members of
#     the same network from each other - chat-mcp could open a TCP
#     connection straight to workspace-mcp:8801). Splitting workspace-mcp
#     onto its own network that chat-mcp never joins closes that gap.
#   - internal-chat: a second `internal: true` network joined only by
#     chat-mcp and orchestrator, for the `chat_send`/`chat_receive` MCP
#     path - kept separate from internal-workspace precisely so chat-mcp
#     has no route to workspace-mcp (or vice versa).
#   - internal-docker-proxy: an `internal: true` network joined only by
#     workspace-mcp and docker-socket-proxy (ADR-0002 §3). Deliberately
#     NOT shared with internal-workspace - orchestrator must not gain a
#     direct route to the socket proxy's (filtered but still real)
#     container/exec API, only to workspace-mcp's single hardcoded-target
#     `exec` tool. Same reasoning as the internal-workspace/internal-chat
#     split above, applied to the new proxy.
#   - internal-memory: an `internal: true` network joined only by
#     memory-mcp and orchestrator (ADR-0002 §5) - its own network, not
#     reused from internal-workspace or internal-chat, for the same reason
#     those two are split from each other: two MCP servers on one shared
#     internal network can reach each other directly, which none of them
#     should be able to do.
#   - egress:    normal outbound network, attached only to orchestrator,
#     for the LLM provider's API/auth endpoints.
#   - chat-ui:   a second network for chat-mcp only, used solely to publish
#     its UI port to the host loopback. It is NOT marked `internal: true`
#     because Docker silently fails to wire up published ports for a
#     container whose only network is internal (confirmed: `docker port`
#     reports the mapping but nothing actually listens on the host).
#     Masquerade is disabled instead, so chat-mcp still has no route to
#     the outside world - only to the host via the published port.

networks:
  internal-workspace:
    internal: true
  internal-chat:
    internal: true
  internal-docker-proxy:
    internal: true
  internal-memory:
    internal: true
  egress: {}
  chat-ui:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

services:
  workspace:
    image: pandora-workspace:dev
    container_name: pandora-workspace
    network_mode: "none"
    # Kata Containers (ADR-0002 Decision 1): swaps the OCI runtime from
    # `runc` (shared host kernel) to a per-container microVM for the one
    # container that runs arbitrary agent-issued shell commands. Defaults
    # to plain `runc` so a checkout without Kata installed/registered
    # still comes up - set WORKSPACE_RUNTIME=kata in .env once Kata is
    # set up on the host (see .env.example / README).
    runtime: ${WORKSPACE_RUNTIME:-runc}
    restart: on-failure

  # Scoped Docker-socket proxy, fronting the raw socket for workspace-mcp.
  # ADR-0001 §5 deferred this ("raw socket for v1"); ADR-0002 §3 ships it -
  # complementary to, not a substitute for, the Kata runtime on `workspace`
  # below: this shrinks what workspace-mcp's Docker access can do even if
  # its own code is fully compromised, whereas Kata shrinks the blast
  # radius of a *code* bug reaching the host kernel. Only CONTAINERS (to
  # resolve the target container) and EXEC (to run in it) are allowed -
  # everything else (IMAGES, NETWORKS, VOLUMES, POST-to-create-containers,
  # etc.) is off by default in tecnativa/docker-socket-proxy. This is now
  # the *only* container with the socket bind mount.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: pandora-docker-socket-proxy
    # Its own network, not internal-workspace - orchestrator must not be
    # able to reach this directly, only through workspace-mcp. See the
    # internal-docker-proxy comment above.
    networks: [internal-docker-proxy]
    environment:
      - CONTAINERS=1
      - EXEC=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  workspace-mcp:
    image: pandora-workspace-mcp:dev
    # internal-workspace: reachable from orchestrator (existing).
    # internal-docker-proxy: reaches docker-socket-proxy (ADR-0002 §3) -
    # orchestrator is not on this network, so it can't reach the proxy
    # directly, only workspace-mcp's own narrow `exec` tool.
    networks: [internal-workspace, internal-docker-proxy]
    environment:
      - WORKSPACE_CONTAINER_ID=pandora-workspace
      # No socket bind mount here any more - the `docker` CLI talks to
      # docker-socket-proxy's filtered API instead of the host daemon
      # directly. See ADR-0002 §3 above.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      - workspace
      - docker-socket-proxy
    restart: on-failure

  # Reference MCP memory server (ADR-0002 Decision 4) - a knowledge graph
  # of entities/relations/observations, persisted to a named volume so it
  # survives a container recreate. Internal-only, reachable from the
  # orchestrator alone, no internet egress, no Docker socket - same
  # network shape as chat-mcp, not workspace-mcp.
  memory-mcp:
    image: pandora-memory-mcp:dev
    networks: [internal-memory]
    volumes:
      - memory-data:/data
    restart: on-failure

  chat-mcp:
    image: pandora-chat-mcp:dev
    networks: [internal-chat, chat-ui]
    environment:
      - CHAT_MCP_TOKEN=${CHAT_MCP_TOKEN:-}
    ports:
      # Only the human-facing UI port is published, and only to loopback.
      # The MCP port (8802) stays internal-only, reachable solely from the
      # orchestrator over the `internal-chat` network.
      - "127.0.0.1:8787:8787"
    restart: on-failure

  orchestrator:
    image: pandora-orchestrator:dev
    networks: [internal-workspace, internal-chat, internal-memory, egress]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_MCP_URL=http://chat-mcp:8802/mcp
    depends_on:
      - workspace-mcp
      - chat-mcp
      - memory-mcp
    restart: on-failure

volumes:
  # Memory MCP's knowledge-graph store (ADR-0002 Decision 4) - the first
  # piece of Pandora state deliberately meant to survive a container
  # recreate, unlike chat-mcp's in-memory (and unpersisted) ChatState.
  memory-data: {}
