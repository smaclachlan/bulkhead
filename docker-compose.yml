# Phase 1 topology - see docs/adr/0001-phase-1-four-container-architecture.md
# and docs/plans/phase-1-implementation-plan.md (Milestone 5).
#
# Images are pre-built (not built by Compose itself): `workspace` via
# `nix build .#workspace-image` + `docker load`, the other three via
# `nix run .#build-<name>-image` (plain `docker build`). `nix run .#up`
# does both steps before invoking this file - see flake.nix.
#
# Network segmentation:
#   - workspace: no network at all (README point 4).
#   - internal-workspace: an `internal: true` network joined only by
#     workspace-mcp and orchestrator. ADR-0001 §1 says workspace-mcp should
#     be reachable from the Orchestrator only - phase 1's validation harness
#     (validation-results/phase-1/) found that a single shared `internal`
#     network doesn't actually enforce that (Compose's `internal: true`
#     blocks egress to the outside world, but does NOT isolate members of
#     the same network from each other - chat-mcp could open a TCP
#     connection straight to workspace-mcp:8801). Splitting workspace-mcp
#     onto its own network that chat-mcp never joins closes that gap.
#   - internal-chat: a second `internal: true` network joined only by
#     chat-mcp and orchestrator, for the `chat_send`/`chat_receive` MCP
#     path - kept separate from internal-workspace precisely so chat-mcp
#     has no route to workspace-mcp (or vice versa).
#   - internal-docker-proxy: an `internal: true` network joined only by
#     workspace-mcp and docker-socket-proxy (ADR-0002 §3). Deliberately
#     NOT shared with internal-workspace - orchestrator must not gain a
#     direct route to the socket proxy's (filtered but still real)
#     container/exec API, only to workspace-mcp's single hardcoded-target
#     `exec` tool. Same reasoning as the internal-workspace/internal-chat
#     split above, applied to the new proxy.
#   - internal-memory: an `internal: true` network joined only by
#     memory-mcp and orchestrator (ADR-0002 §5) - its own network, not
#     reused from internal-workspace or internal-chat, for the same reason
#     those two are split from each other: two MCP servers on one shared
#     internal network can reach each other directly, which none of them
#     should be able to do.
#   - internal-git: an `internal: true` network joined only by git-mcp and
#     orchestrator (ADR-0003 §5) - same reasoning as internal-memory above,
#     its own network rather than reused from any other MCP server's.
#   - git-egress: normal outbound network, attached only to git-mcp, for
#     its one outbound connection to the pre-configured git remote
#     (ADR-0003 §5). Deliberately separate from `egress` below - the
#     Orchestrator has no business reaching the git remote directly, and
#     git-mcp has no business reaching the LLM provider.
#   - egress:    normal outbound network, attached only to orchestrator,
#     for the LLM provider's API/auth endpoints.
#   - chat-ui:   a second network for chat-mcp only, used solely to publish
#     its UI port to the host loopback. It is NOT marked `internal: true`
#     because Docker silently fails to wire up published ports for a
#     container whose only network is internal (confirmed: `docker port`
#     reports the mapping but nothing actually listens on the host).
#     Masquerade is disabled instead, so chat-mcp still has no route to
#     the outside world - only to the host via the published port.

networks:
  internal-workspace:
    internal: true
  internal-chat:
    internal: true
  internal-docker-proxy:
    internal: true
  internal-memory:
    internal: true
  internal-git:
    internal: true
  git-egress: {}
  egress: {}
  chat-ui:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

services:
  workspace:
    # Derived per-profile by `nix run .#up` (scripts/lib/profile.sh) - never
    # hand-set in .env. This is the one image whose content is meant to vary
    # by profile (a custom WORKSPACE_DOCKERFILE_DIR is the whole point of a
    # second profile), so unlike the other five services below it can't share
    # a fixed tag across concurrently-running profiles.
    image: ${WORKSPACE_IMAGE:-bulkhead-workspace:dev}
    # Templated (not a bare literal) so concurrent stacks under different
    # profiles/projects don't collide on the same container name - flake.nix's
    # `up` computes this from the profile file so it's stable across runs of
    # the same profile, and matches workspace-mcp's WORKSPACE_CONTAINER_ID
    # below by construction. Defaults to today's exact fixed name so an
    # unprofiled `nix run .#up` (just `.env`) is unaffected.
    container_name: ${WORKSPACE_CONTAINER_NAME:-bulkhead-workspace}
    network_mode: "none"
    # Kata Containers (ADR-0002 Decision 1): swaps the OCI runtime from
    # `runc` (shared host kernel) to a per-container microVM for the one
    # container that runs arbitrary agent-issued shell commands. Defaults
    # to plain `runc` so a checkout without Kata installed/registered
    # still comes up - set WORKSPACE_RUNTIME=kata in .env once Kata is
    # set up on the host (see .env.example / README).
    runtime: ${WORKSPACE_RUNTIME:-runc}
    # Forces the container to just idle, regardless of what CMD/ENTRYPOINT
    # the image itself declares - workspace-mcp only ever `docker exec`s
    # into this container, it never `docker run`s per command (README
    # point 4), so whatever's actually in the image (the default minimal
    # one, or a custom WORKSPACE_DOCKERFILE_DIR image - see README's
    # "Workspace image" section) must not run its own entrypoint here.
    # Requires a POSIX shell and `sleep` in the image - true of the default
    # image and of essentially any real base distro a custom Dockerfile
    # would use.
    command: ["sh", "-c", "sleep infinity"]
    # The agent's actual working tree (ADR-0003 Decision 1). Since ADR-0004,
    # this volume is exclusive to `workspace` - git-mcp no longer mounts it
    # or anything else here. `workspace`'s own image now has `git` installed
    # (workspace/default.nix) so local git ops - and any hooks a checkout
    # triggers - run in this fully network-isolated container, not next to
    # git-mcp's deploy key. git-mcp exchanges `git bundle` files with this
    # repo via workspace-mcp's admin port instead of sharing a filesystem
    # with it - see docs/adr/0004-git-mcp-bundle-relay.md.
    #
    # Source defaults to the named volume `workspace-repo` (declared below) -
    # fully internal to Docker, no host filesystem exposed. Set
    # WORKSPACE_HOST_PATH to a host directory instead (e.g. for a large
    # existing checkout you don't want to `git clone` into the volume) and
    # Compose's short-syntax volume source switches from a named volume to
    # a bind mount, same ambiguity Compose always resolves this way. This is
    # a deliberate security relaxation: the container (and anything a
    # compromised build/test/hook run in it does) then has read/write access
    # to that host path, not just an isolated Docker-managed volume. Also
    # note this container runs as a fixed non-root UID (workspace/default.nix)
    # - a bind-mounted host directory keeps its host-side ownership, which
    # that UID may not have write access to; the named-volume default has no
    # such issue since the image pre-chowns it. See WORKSPACE_USER below.
    volumes:
      - ${WORKSPACE_HOST_PATH:-workspace-repo}:${WORKSPACE_REPO_PATH:-/repo}
    # Empty by default - Docker then falls back to the image's own user
    # (10001:10001 for the default Nix image; whatever a custom
    # WORKSPACE_DOCKERFILE_DIR's own Dockerfile sets, root included). Only
    # meaningful with WORKSPACE_HOST_PATH set, to match the bind-mounted
    # host directory's owner - `nix run .#up` auto-fills this from the
    # invoking user's own uid:gid in that case if left unset (see flake.nix).
    user: "${WORKSPACE_USER:-}"
    restart: on-failure

  # Scoped Docker-socket proxy, fronting the raw socket for workspace-mcp.
  # ADR-0001 §5 deferred this ("raw socket for v1"); ADR-0002 §3 ships it -
  # complementary to, not a substitute for, the Kata runtime on `workspace`
  # below: this shrinks what workspace-mcp's Docker access can do even if
  # its own code is fully compromised, whereas Kata shrinks the blast
  # radius of a *code* bug reaching the host kernel. Only CONTAINERS (to
  # resolve the target container) and EXEC (to run in it) are allowed -
  # everything else (IMAGES, NETWORKS, VOLUMES, POST-to-create-containers,
  # etc.) is off by default in tecnativa/docker-socket-proxy. This is now
  # the *only* container with the socket bind mount.
  #
  # Known, accepted gap: this image only gates whole API categories on or
  # off - there's no way to restrict *which* container EXEC is allowed
  # against, so a fully-compromised workspace-mcp could exec into any
  # container on the host, not just `workspace`. A custom nginx-based
  # replacement was tried (path-matching scoped to one container name) and
  # reverted - nginx's HTTP proxy module doesn't reliably relay Docker's
  # exec/attach hijack protocol (a raw stream after an HTTP upgrade) over a
  # unix-socket upstream; several standard fixes (socket permissions,
  # allowing /_ping, upgrade headers, disabling chunked encoding) were each
  # individually necessary but never collectively sufficient to get output
  # through. The correct way to get real per-container restriction is a
  # Docker Authorization Plugin (daemon-level, gates the request without
  # sitting in the hijacked stream's data path at all) or a purpose-built
  # raw-relay filter (peek at the request line once, then dumb-forward
  # bytes) - both are real, separately-scoped follow-ups, not done here.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    # No container_name override (unlike `workspace`) - nothing references
    # this one by a fixed literal name (workspace-mcp reaches it by service
    # name, `docker-socket-proxy`, over internal-docker-proxy, which Compose
    # resolves per-project regardless), and a fixed name here would collide
    # across concurrent stacks the same way workspace's did.
    # Its own network, not internal-workspace - orchestrator must not be
    # able to reach this directly, only through workspace-mcp. See the
    # internal-docker-proxy comment above.
    networks: [internal-docker-proxy]
    environment:
      - CONTAINERS=1
      - EXEC=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  workspace-mcp:
    image: bulkhead-workspace-mcp:dev
    # internal-workspace: reachable from orchestrator (existing) - also
    # where its new admin port (export_bundle/import_bundle,
    # docs/adr/0004-git-mcp-bundle-relay.md) is reached from; no new network
    # needed since it's the same server_names-excluded-tool pattern
    # git-mcp's own admin port already uses, just reached over an existing
    # network rather than a new one between the two MCP servers directly.
    # internal-docker-proxy: reaches docker-socket-proxy (ADR-0002 §3) -
    # orchestrator is not on this network, so it can't reach the proxy
    # directly, only workspace-mcp's own narrow `exec` tool.
    networks: [internal-workspace, internal-docker-proxy]
    environment:
      # Must always equal the `workspace` service's own container_name above
      # - same variable, so they can't drift apart across profiles.
      - WORKSPACE_CONTAINER_ID=${WORKSPACE_CONTAINER_NAME:-bulkhead-workspace}
      # No socket bind mount here any more - the `docker` CLI talks to
      # docker-socket-proxy's filtered API instead of the host daemon
      # directly. See ADR-0002 §3 above.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      - workspace
      - docker-socket-proxy
    restart: on-failure

  # Reference MCP memory server (ADR-0002 Decision 4) - a knowledge graph
  # of entities/relations/observations, persisted to a named volume so it
  # survives a container recreate. Internal-only, reachable from the
  # orchestrator alone, no internet egress, no Docker socket - same
  # network shape as chat-mcp, not workspace-mcp.
  memory-mcp:
    image: bulkhead-memory-mcp:dev
    networks: [internal-memory]
    volumes:
      - memory-data:/data
    restart: on-failure

  # Git MCP (ADR-0003, reworked by ADR-0004) - the code egress path. Only
  # container with network egress to the git remote and the only one
  # holding the deploy key; no Docker socket, unlike workspace-mcp - a
  # different privilege shape entirely (filesystem + one outbound network
  # path, not host container control). Runs two MCP endpoints in one
  # process (server.py) - see ADR-0003 Decision 3 for why
  # push_execute/pending_push/push_cancel are on a separate port that's
  # never registered with the Orchestrator's LLM.
  #
  # No longer shares any volume with `workspace` (ADR-0004) - its own
  # `git-gateway-data` volume below holds a private *bare mirror* of the
  # remote, not a working tree. Local git ops (and any hooks they trigger)
  # now run in `workspace`, which has `git` installed; this container's own
  # git invocations are limited to fetch/push against its gateway mirror and
  # `git bundle` create/import for the Orchestrator's relay - none of which
  # can be induced to run attacker-supplied code (see state.py's
  # HARDENED_GIT_ARGS and its module docstring).
  #
  # no-new-privileges/pids_limit below are a second, container-level layer
  # of the same "no side effects here" property the code enforces - even a
  # full RCE in this process can't re-acquire privilege via a setuid/setcap
  # binary. NOT cap_drop: [ALL] - tried and reverted (confirmed live):
  # dropping every capability also strips CAP_DAC_OVERRIDE, which root needs
  # to read the bind-mounted deploy key when its host-side owner isn't UID 0
  # (the normal case) - state.py's _prepare_ssh_key crashed on every start
  # with EACCES on /run/secrets/deploy_key, before ssh-agent ever came up.
  # Still runs as root and without a read-only root filesystem (ssh-agent's
  # socket, the deploy key's private copy, and bundle tempfiles all need
  # somewhere writable) - a non-root user plus `read_only: true` is a
  # further hardening step, not done here; see
  # docs/adr/0004-git-mcp-bundle-relay.md's Consequences.
  git-mcp:
    image: bulkhead-git-mcp:dev
    networks: [internal-git, git-egress]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    volumes:
      - git-gateway-data:${GIT_GATEWAY_PATH:-/gitdir}
      # Read-only deploy key, this container only (ADR-0003 Decision 4). The
      # default is a checked-in placeholder (not a real key) so the stack
      # still comes up unconfigured - git-mcp's tools all report "not
      # configured" until GIT_REMOTE_URL and this path are set for real (see
      # README's Git MCP setup section / state.py's `configured` flag).
      - ${GIT_SSH_DEPLOY_KEY_HOST_PATH:-./git-mcp/no-deploy-key-configured}:/run/secrets/deploy_key:ro
    environment:
      - GIT_REMOTE_URL=${GIT_REMOTE_URL:-}
      - GIT_REMOTE_NAME=${GIT_REMOTE_NAME:-origin}
      - GIT_PUSH_BRANCH_PATTERN=${GIT_PUSH_BRANCH_PATTERN:-agent/*}
      - GIT_GATEWAY_PATH=${GIT_GATEWAY_PATH:-/gitdir}
    restart: on-failure

  chat-mcp:
    image: bulkhead-chat-mcp:dev
    networks: [internal-chat, chat-ui]
    environment:
      - CHAT_MCP_TOKEN=${CHAT_MCP_TOKEN:-}
    ports:
      # Only the human-facing UI port is published, and only to loopback.
      # The MCP port (8802) stays internal-only, reachable solely from the
      # orchestrator over the `internal-chat` network. Host-side port is
      # overridable (CHAT_UI_HOST_PORT) so concurrent stacks under different
      # profiles don't fight over the same host port; container-side stays
      # 8787 always, that's purely internal to this container/image.
      - "127.0.0.1:${CHAT_UI_HOST_PORT:-8787}:8787"
    restart: on-failure

  orchestrator:
    image: bulkhead-orchestrator:dev
    networks: [internal-workspace, internal-chat, internal-memory, internal-git, egress]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CHAT_MCP_URL=http://chat-mcp:8802/mcp
      # git-mcp's admin port (push_execute/pending_push/push_cancel, plus
      # the bundle-relay tools) is reached directly by git_admin_client.py,
      # not via mcp_agent.config.yaml/server_names - see ADR-0003 Decision 3.
      - GIT_MCP_ADMIN_URL=http://git-mcp:8806/mcp
      # workspace-mcp's admin port (export_bundle/import_bundle) - same
      # exclusion, reached directly by workspace_admin_client.py. See
      # docs/adr/0004-git-mcp-bundle-relay.md.
      - WORKSPACE_MCP_ADMIN_URL=http://workspace-mcp:8807/mcp
      # Off by default: main.py strips mcp-agent's own
      # "[Calling tool X with args Y]" notices out of the reply before
      # relaying it to chat-mcp, so the chat transcript only shows the
      # actual answer. Set to 1/true/yes to keep them - chat-mcp's UI/CLI
      # then render matching lines in italics to tell them apart from the
      # real reply.
      - CHAT_SHOW_TOOL_CALLS=${CHAT_SHOW_TOOL_CALLS:-}
    depends_on:
      - workspace-mcp
      - chat-mcp
      - memory-mcp
      - git-mcp
    restart: on-failure

volumes:
  # Memory MCP's knowledge-graph store (ADR-0002 Decision 4) - the first
  # piece of Bulkhead state deliberately meant to survive a container
  # recreate, unlike chat-mcp's in-memory (and unpersisted) ChatState.
  memory-data: {}
  # The Workspace's actual working tree (ADR-0003 Decision 1, resolving
  # README point 8) - `workspace` only since ADR-0004; git-mcp no longer
  # mounts this at all.
  workspace-repo: {}
  # git-mcp's own private bare mirror of the remote (ADR-0004) - not a
  # working tree, never mounted anywhere else. Wiped together with
  # workspace-repo by `nix run .#reset-repo` so both sides of the relay
  # start clean together.
  git-gateway-data: {}
