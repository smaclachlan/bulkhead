# mcp-agent configuration for the phase 1 Orchestrator.
# Schema: https://github.com/lastmile-ai/mcp-agent/blob/main/src/mcp_agent/config.py
#
# Phase 1: one MCP server registered here - Workspace MCP. Chat MCP is
# reached directly by orchestrator/src/orchestrator/chat_client.py, not
# through this Agent-facing server list - see main.py's docstring and
# docs/adr/0001-phase-1-four-container-architecture.md.
#
# Phase 2 (docs/adr/0002-phase-2-isolation-ux-memory.md Decision 4) adds
# Memory MCP as a second Agent-facing server - a deliberate, scoped
# narrowing of ADR-0001 §2's "one tool" invariant, not a reversal of it:
# see that ADR section for why this one server is the accepted exception.
#
# Phase 3 (docs/adr/0003-phase-3-git-mcp.md Decision 3) adds Git MCP's
# LLM-facing port only (status/diff/log/branch_list/commit/create_branch/
# checkout/push_request). Its admin port (push_execute/pending_push/
# push_cancel) is deliberately NOT listed here - it's reached directly by
# orchestrator/src/orchestrator/git_admin_client.py, the same
# hand-rolled-client pattern chat_client.py already uses, so those three
# tools stay structurally unreachable by the LLM.
$schema: https://raw.githubusercontent.com/lastmile-ai/mcp-agent/refs/heads/main/schema/mcp-agent.config.schema.json

name: bulkhead-orchestrator

execution_engine: asyncio

logger:
  transports: [console]
  level: info

mcp:
  servers:
    # Server key "workspace" + Workspace MCP's "exec" tool is namespaced by
    # mcp-agent as "workspace_exec" - the tool name implementation.md names.
    workspace:
      transport: streamable_http
      url: "http://workspace-mcp:8801/mcp"
    # Server key "memory" + its nine tools become "memory_create_entities",
    # "memory_search_nodes", etc. See ADR-0002 Decision 4 for the tool list
    # and the memory-store-poisoning risk it names.
    memory:
      transport: streamable_http
      url: "http://memory-mcp:8803/mcp"
    # Server key "git" + its eight tools become "git_status", "git_diff",
    # "git_push_request", etc. See ADR-0003 Decision 2/3 for the tool list
    # and why push_request only stages a request rather than pushing.
    git:
      transport: streamable_http
      url: "http://git-mcp:8805/mcp"

# API key goes in mcp_agent.secrets.yaml (gitignored) or the ANTHROPIC_API_KEY
# env var - see mcp_agent.secrets.yaml.example.
anthropic:
  default_model: claude-sonnet-5
